<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="project2.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="box">
      <div class="row">
        <div class="col-5 left">
          <div id="emoji">🥐</div>
          <h3>Order ahead, skip the line.</h3>
          <p>
            Tell us what you're craving and when you'd like it, and it'll be
            waiting warm at the counter — or on your doorstep.
          </p>
        </div>
        <div class="col-7 right">
          <p>Full name</p>
          <input type="text" placeholder="Jamie Rivera" />
          <p>Email</p>
          <input type="text" placeholder="jamie@example.com" />
          <p>Pickup or delivery?</p>
          <select class="form-select" aria-label="Default select example">
            <option selected>Pickup</option>
            <option value="1">One</option>
            <option value="2">Two</option>
          </select>
          <p>Favorite treat</p>
          <label>
            <input type="radio" name="treat" value="croissant" />
            Croissant
          </label>

          <label>
            <input type="radio" name="treat" value="sourdough" />
            Sourdough
          </label>

          <label>
            <input type="radio" name="treat" value="cupcake" />
            Cupcake
          </label>
          <p>Notes (optional)</p>
          <textarea
            class="form-control"
            id="exampleTextarea"
            rows="3"
            placeholder="Any allergies or special requests?"
          ></textarea>
          <input type="checkbox" class="form-check-input" id="exampleCheck1" />
          <label class="form-check-label" for="exampleCheck1"
            >Sign me up for the weekly newsletter</label
          >
          <button type="button">Place order</button>
        </div>
      </div>
    </div>
  </body>
</html>
